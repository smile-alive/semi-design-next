packages:
    - 'packages/*'
    - 'packages/shared/*'
    - 'packages/plugins/*'
    - 'website'

overrides:
    # Astro and the other Vite consumers share the vite-plus build used by tests and vp pack, so the shared Vite config
    # in vite.semi.ts has a single set of types and runtime
    vite: 'catalog:'

# Every dependency declared by two or more manifests takes its range from here, so the workspace cannot drift apart;
# catalogMode makes `pnpm add` write `catalog:` for a dependency listed here
catalogMode: prefer

catalog:
    '@astrojs/svelte': ^9.1.6
    '@changesets/cli': ^3.0.3
    # 0.x minors may break the API: patches only, a minor upgrade is a deliberate change
    '@dnd-kit/abstract': ~0.5.3
    '@dnd-kit/dom': ~0.5.3
    '@dnd-kit/react': ~0.5.3
    '@dnd-kit/solid': ~0.5.3
    '@dnd-kit/svelte': ~0.5.3
    '@dnd-kit/vue': ~0.5.3
    '@floating-ui/dom': ^1.7.4
    '@nuxt/kit': ^4.6.4
    # Must stay on shiki's own @shikijs/core version, otherwise two copies are installed
    '@shikijs/core': ^4.6.0
    '@sveltejs/package': ^3.0.2
    '@sveltejs/vite-plugin-svelte': ^7.3.1
    '@tanstack/react-virtual': ^3.14.26
    '@tanstack/solid-virtual': ^3.13.53
    '@tanstack/svelte-virtual': ^3.13.52
    '@tanstack/vue-virtual': ^3.13.52
    '@testing-library/react': ^16.3.3
    '@testing-library/svelte': ^5.4.2
    # The @tiptap packages peer on each other's exact version, so the whole family is listed here and moves together;
    # patches only, so a newer @tiptap/vue-3 cannot resolve ahead of the locked core
    '@tiptap/core': ~3.34.0
    '@tiptap/extension-blockquote': ~3.34.0
    '@tiptap/extension-bold': ~3.34.0
    '@tiptap/extension-code': ~3.34.0
    '@tiptap/extension-code-block': ~3.34.0
    '@tiptap/extension-document': ~3.34.0
    '@tiptap/extension-hard-break': ~3.34.0
    '@tiptap/extension-heading': ~3.34.0
    '@tiptap/extension-horizontal-rule': ~3.34.0
    '@tiptap/extension-image': ~3.34.0
    '@tiptap/extension-italic': ~3.34.0
    '@tiptap/extension-link': ~3.34.0
    '@tiptap/extension-list': ~3.34.0
    '@tiptap/extension-mention': ~3.34.0
    '@tiptap/extension-paragraph': ~3.34.0
    '@tiptap/extension-strike': ~3.34.0
    '@tiptap/extension-text': ~3.34.0
    '@tiptap/extension-text-align': ~3.34.0
    '@tiptap/extension-text-style': ~3.34.0
    '@tiptap/extensions': ~3.34.0
    '@tiptap/pm': ~3.34.0
    '@tiptap/react': ~3.34.0
    '@tiptap/vue-3': ~3.34.0
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-vue': ^6.0.11
    clsx: ^2.1.1
    css-loader: ^7.1.5
    date-fns: ^4.4.0
    es-toolkit: ^1.53.2
    eslint-plugin-svelte: ^3.24.1
    jsdom: ^31.0.1
    motion-v: ^2.12.0
    nuxt: ^4.6.4
    playwright: 1.65.1
    react: ^19.3.1
    react-dom: ^19.3.1
    remark-gfm: 4.0.1
    remark-mdx: 3.1.1
    remark-parse: 11.0.0
    remark-stringify: 11.0.0
    sass: ^1.108.2
    # Vite compiles SCSS with sass-embedded when installed (vite-plus-core pulls it in as a peer) and the plugins with
    # sass, so both stay on the same release
    sass-embedded: ^1.108.2
    # 3.2.0 shipped ES2020 syntax and a Node 26 engines field; 3.2.1 reverted both
    scroll-into-view-if-needed: ^3.2.1
    shiki: ^4.6.0
    solid-js: ^1.9.18
    svelte: ^5.57.3
    svelte-check: ^4.7.8
    svelte-eslint-parser: ^1.10.1
    typescript: ^6.0.3
    unified: ^11.0.5
    # 3.x compiles for Solid 2; the packages stay on Solid 1.x until X15
    unplugin-solid: ^2.0.0
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vue: ^3.5.45
    vue-tsc: ^3.3.14
    webpack: ^5.112.2
    zod: ^4.6.7

catalogs:
    # Published peer ranges stay wider than the versions the workspace develops against, so they cannot share an entry
    # with the default catalog. React 19.3 is the floor: Tooltip reads its trigger through <Fragment ref>
    peer:
        react: ^19.3.0
        react-dom: ^19.3.0
        vue: ^3.5.0
        webpack: ^5.77.0
        # The dom build imports setStyleProperty, added in 1.9.8, and the tests only run on 1.9.17
        solid-js: ^1.9.17
        # createContext (5.40) is the newest API the packages use; the tests only run on 5.57
        svelte: ^5.57.0

packageExtensions:
    # astro2tsx pins @emnapi/core but omits the matching runtime, so pnpm fills the peer with rspack's 2.0 beta and
    # astro check fails to load
    '@astrojs/astro2tsx@0.1.2':
        dependencies:
            '@emnapi/runtime': 1.11.3

allowBuilds:
    esbuild: true
    # sass's optional native watcher; only `sass --watch` uses it
    '@parcel/watcher': false

minimumReleaseAgeExclude:
    - stylelint-config-recess-order@7.10.1
