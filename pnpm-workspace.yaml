packages:
    - 'packages/*'
    - 'packages/shared/*'
    - 'packages/plugins/*'
    - 'website'

overrides:
    # Astro and the other Vite consumers share the vite-plus build used by tests and vp pack, so the shared Vite config
    # in vite.semi.ts has a single set of types and runtime
    vite: 'catalog:'

# Every dependency declared by two or more manifests takes its range from here, so the workspace cannot drift apart;
# catalogMode makes `pnpm add` write `catalog:` for a dependency listed here
catalogMode: prefer

catalog:
    '@astrojs/svelte': ^9.1.4
    '@changesets/cli': ^3.0.3
    # 0.x minors may break the API: patches only, a minor upgrade is a deliberate change
    '@dnd-kit/abstract': ~0.5.3
    '@dnd-kit/dom': ~0.5.3
    '@dnd-kit/react': ~0.5.3
    '@dnd-kit/solid': ~0.5.3
    '@dnd-kit/svelte': ~0.5.3
    '@dnd-kit/vue': ~0.5.3
    '@floating-ui/dom': ^1.7.4
    '@nuxt/kit': ^4.6.4
    # Must stay on shiki's own @shikijs/core version, otherwise two copies are installed
    '@shikijs/core': ^4.6.0
    '@sveltejs/package': ^3.0.2
    '@sveltejs/vite-plugin-svelte': ^7.3.1
    '@tanstack/react-virtual': ^3.14.26
    '@tanstack/solid-virtual': ^3.13.53
    '@tanstack/svelte-virtual': ^3.13.52
    '@tanstack/vue-virtual': ^3.13.52
    '@testing-library/react': ^16.3.3
    '@testing-library/svelte': ^5.4.2
    # The @tiptap packages peer on each other's exact version, so the whole family is listed here and moves together;
    # patches only, so a newer @tiptap/vue-3 cannot resolve ahead of the locked core
    '@tiptap/core': ~3.33.1
    '@tiptap/extension-blockquote': ~3.33.1
    '@tiptap/extension-bold': ~3.33.1
    '@tiptap/extension-code': ~3.33.1
    '@tiptap/extension-code-block': ~3.33.1
    '@tiptap/extension-document': ~3.33.1
    '@tiptap/extension-hard-break': ~3.33.1
    '@tiptap/extension-heading': ~3.33.1
    '@tiptap/extension-horizontal-rule': ~3.33.1
    '@tiptap/extension-image': ~3.33.1
    '@tiptap/extension-italic': ~3.33.1
    '@tiptap/extension-link': ~3.33.1
    '@tiptap/extension-list': ~3.33.1
    '@tiptap/extension-mention': ~3.33.1
    '@tiptap/extension-paragraph': ~3.33.1
    '@tiptap/extension-strike': ~3.33.1
    '@tiptap/extension-text': ~3.33.1
    '@tiptap/extension-text-align': ~3.33.1
    '@tiptap/extension-text-style': ~3.33.1
    '@tiptap/extensions': ~3.33.1
    '@tiptap/pm': ~3.33.1
    '@tiptap/react': ~3.33.1
    '@tiptap/vue-3': ~3.33.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@vitejs/plugin-vue': ^6.0.10
    clsx: ^2.1.1
    css-loader: ^7.1.5
    date-fns: ^4.4.0
    es-toolkit: ^1.53.2
    eslint-plugin-svelte: ^3.24.1
    jsdom: ^31.0.0
    motion-v: ^2.11.1
    nuxt: ^4.6.4
    playwright: 1.65.0
    react: ^19.3.1
    react-dom: ^19.3.1
    sass: ^1.108.1
    # Vite compiles SCSS with sass-embedded when installed (vite-plus-core pulls it in as a peer) and the plugins with
    # sass, so both stay on the same release
    sass-embedded: ^1.108.1
    scroll-into-view-if-needed: ^3.1.0
    shiki: ^4.6.0
    solid-js: ^1.9.18
    svelte: ^5.57.3
    svelte-check: ^4.7.8
    svelte-eslint-parser: ^1.10.1
    typescript: ^6.0.3
    unified: ^11.0.5
    # 3.x compiles for Solid 2; the packages stay on Solid 1.x until X15
    unplugin-solid: ^2.0.0
    vite: npm:@voidzero-dev/vite-plus-core@1.5.1
    vue: ^3.5.45
    vue-tsc: ^3.3.14
    webpack: ^5.112.2
    zod: ^4.6.7

catalogs:
    # Published peer ranges stay wider than the versions the workspace develops against, so they cannot share an entry
    # with the default catalog. React 19.3 is the floor: Tooltip reads its trigger through <Fragment ref>
    peer:
        react: ^19.3.0
        react-dom: ^19.3.0
        vue: ^3.5.0
        webpack: ^5.77.0
        # The dom build imports setStyleProperty, added in 1.9.8, and the tests only run on 1.9.17
        solid-js: ^1.9.17
        # createContext (5.40) is the newest API the packages use; the tests only run on 5.57
        svelte: ^5.57.0

packageExtensions:
    # astro2tsx pins @emnapi/core but omits the matching runtime, so pnpm fills the peer with rspack's 2.0 beta and
    # astro check fails to load
    '@astrojs/astro2tsx@0.1.2':
        dependencies:
            '@emnapi/runtime': 1.11.3

allowBuilds:
    esbuild: true
    # sass's optional native watcher; only `sass --watch` uses it
    '@parcel/watcher': false

minimumReleaseAgeExclude:
    - '@astrojs/vue@7.1.4'
    - framer-motion@14.12.0
    - motion-dom@14.12.0
    - '@astrojs/svelte@9.1.4'
    - svelte-eslint-parser@1.10.1
    - '@astrojs/internal-helpers@0.13.2'
    - '@astrojs/markdown-remark@7.3.7'
    - '@astrojs/markdown-satteri@0.4.8'
    - '@astrojs/mdx@8.1.4'
    - '@astrojs/react-renderer@0.1.1'
    - '@astrojs/react@7.1.7'
    - '@astrojs/runtime@0.1.0'
    - '@astrojs/solid-js-renderer@0.1.0'
    - '@astrojs/solid-js@7.1.4'
    - '@astrojs/svelte-renderer@0.1.0'
    - '@astrojs/vite-plugin-astro@0.1.1'
    - '@astrojs/vue-renderer@0.1.0'
    - '@rspack/binding-darwin-arm64@2.3.2'
    - '@rspack/binding-darwin-x64@2.3.2'
    - '@rspack/binding-linux-arm64-gnu@2.3.2'
    - '@rspack/binding-linux-arm64-musl@2.3.2'
    - '@rspack/binding-linux-ppc64-gnu@2.3.2'
    - '@rspack/binding-linux-riscv64-gnu@2.3.2'
    - '@rspack/binding-linux-riscv64-musl@2.3.2'
    - '@rspack/binding-linux-s390x-gnu@2.3.2'
    - '@rspack/binding-linux-x64-gnu@2.3.2'
    - '@rspack/binding-linux-x64-musl@2.3.2'
    - '@rspack/binding-wasm32-wasi@2.3.2'
    - '@rspack/binding-win32-arm64-msvc@2.3.2'
    - '@rspack/binding-win32-ia32-msvc@2.3.2'
    - '@rspack/binding-win32-x64-msvc@2.3.2'
    - '@rspack/binding@2.3.2'
    - '@rspack/core@2.3.2'
    - '@tiptap/core@3.33.1'
    - '@tiptap/extension-blockquote@3.33.1'
    - '@tiptap/extension-bold@3.33.1'
    - '@tiptap/extension-bubble-menu@3.33.1'
    - '@tiptap/extension-code-block@3.33.1'
    - '@tiptap/extension-code@3.33.1'
    - '@tiptap/extension-document@3.33.1'
    - '@tiptap/extension-floating-menu@3.33.1'
    - '@tiptap/extension-hard-break@3.33.1'
    - '@tiptap/extension-heading@3.33.1'
    - '@tiptap/extension-horizontal-rule@3.33.1'
    - '@tiptap/extension-image@3.33.1'
    - '@tiptap/extension-italic@3.33.1'
    - '@tiptap/extension-link@3.33.1'
    - '@tiptap/extension-list@3.33.1'
    - '@tiptap/extension-mention@3.33.1'
    - '@tiptap/extension-paragraph@3.33.1'
    - '@tiptap/extension-strike@3.33.1'
    - '@tiptap/extension-text-align@3.33.1'
    - '@tiptap/extension-text-style@3.33.1'
    - '@tiptap/extension-text@3.33.1'
    - '@tiptap/extensions@3.33.1'
    - '@tiptap/pm@3.33.1'
    - '@tiptap/react@3.33.1'
    - '@tiptap/suggestion@3.33.1'
    - '@tiptap/vue-3@3.33.1'
    - astro@7.4.10
    - eslint-plugin-vue@10.12.1
    - motion@14.12.0
