name: 功能建议
description: 新组件、新属性或行为改进
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: 要解决的问题
          description: 现在做不到什么，或者哪里不方便
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: 建议的方案
          description: 期望的 API 或交互；可以参考其他组件库的做法
    - type: dropdown
      id: framework
      attributes:
          label: 涉及的框架
          multiple: true
          options: [React, Vue, Solid]
