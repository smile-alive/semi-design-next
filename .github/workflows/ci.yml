name: CI

on:
    # Markdown feeds no build or test (the site reads .mdx), and the pre-commit hook formats it
    # `reopened` is left out: reopening a PR changes no code, and any later push still runs through `synchronize`
    pull_request:
        types: [opened, synchronize]
        paths-ignore: ['**/*.md']
    # Every push to release runs, since a changeset is a .md file; main runs this through release.yml
    push:
        branches: [release]
    workflow_call:

# Push runs queue instead of cancelling, so a deploy or release never stops halfway
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    # Skipping build skips every job below it
    gate:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            skip: ${{ steps.branch-pr.outputs.skip || steps.synced.outputs.skip }}
        steps:
            # Push runs already cover this SHA, and main's ruleset still needs their matrix checks. A fork's branch of
            # the same name has no such run, so it keeps its CI
            - id: branch-pr
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'release' || github.head_ref == 'main')
              run: echo "skip=true" >> "$GITHUB_OUTPUT"
            # A post-release sync leaves release on the tree that release.yml already checked on main
            - id: synced
              if: github.event_name == 'push' && github.ref == 'refs/heads/release'
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_TREE: ${{ github.event.head_commit.tree_id }}
              run: |
                  if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .commit.tree.sha)" = "$HEAD_TREE" ]; then
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

    # Package exports point at dist, which lint, typecheck and the tests all resolve, so one job builds it for the others
    build:
        needs: gate
        if: needs.gate.outputs.skip != 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup

    lint:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
              with:
                  dist: required
            - run: pnpm format:check
            - run: pnpm lint

    typecheck:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
              with:
                  dist: required
            - run: pnpm typecheck

    test:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                project: [react, vue, solid, svelte, common]
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
              with:
                  dist: required
            - run: pnpm exec vp test run --silent --project '${{ matrix.project }}' --project '${{ matrix.project }}-ssr'

    # release.yml skips CI on main when this marker exists for the same tree. main can read release's caches because
    # release is the default branch
    mark-passed:
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        needs: [lint, typecheck, test]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - run: touch .ci-passed
            - uses: actions/cache/save@v6
              with:
                  path: .ci-passed
                  key: ci-passed-${{ github.event.head_commit.tree_id }}

    preview:
        if: github.repository == 'smile-alive/semi-design-next' && github.event_name == 'push' && github.ref == 'refs/heads/release'
        needs: [lint, typecheck, test]
        uses: ./.github/workflows/site.yml
        secrets: inherit
