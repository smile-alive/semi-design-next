name: CI

on:
    # `reopened` is left out: reopening a PR changes no code, and any later push still runs through `synchronize`
    pull_request:
        types: [opened, synchronize]
    # Release runs once this passes on release; main only ever receives a commit that passed here
    push:
        branches: [release]

# A running push run is never cancelled, so a deploy or release never stops halfway; a newer push still replaces a
# pending one, which is why gate diffs a push from the last passing run rather than from `before`
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

# A skipped job still satisfies main's ruleset, a missing one does not, so every job keeps its name and skips through `if`
jobs:
    gate:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            # `gh run list` finds the last passing push run
            actions: read
        outputs:
            lint: ${{ steps.scope.outputs.lint }}
            build: ${{ steps.scope.outputs.build }}
            typecheck: ${{ steps.scope.outputs.typecheck }}
            tests: ${{ steps.scope.outputs.tests }}
            changed: ${{ steps.scope.outputs.changed }}
        steps:
            - uses: actions/checkout@v5
            # Unclaimed files (lockfile, vitest/, lint/, vite*.ts, package.json, …) run everything: the import graph
            # behind `--changed` cannot see them, so `changed` stays empty
            - id: scope
              env:
                  GH_TOKEN: ${{ github.token }}
                  BASE: ${{ github.event.pull_request.base.sha }}
              run: |
                  all='react vue solid svelte common'
                  full() {
                      printf '%s\n' "lint=full" "build=true" "typecheck=full" "tests=$all" "changed=" >> "$GITHUB_OUTPUT"
                  }
                  # Diffing from `before` would skip a push whose pending run was replaced, and let a green run cover a
                  # red one before it
                  if [ "$GITHUB_EVENT_NAME" = push ]; then
                      BASE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" --branch "$GITHUB_REF_NAME" --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
                  fi
                  # No passing run yet; after a force push the last passing commit is no ancestor and the diff means nothing
                  if [ -z "$BASE" ]; then
                      full
                      exit 0
                  fi
                  if [ "$GITHUB_EVENT_NAME" = push ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$GITHUB_SHA" --jq .status)" != ahead ]; then
                      full
                      exit 0
                  fi
                  git fetch --depth=1 origin "$BASE" || { full; exit 0; }

                  # An empty diff (git failed) counts as more than a version bump
                  version_only() {
                      local diff
                      diff=$(git diff -U0 "$BASE" HEAD -- "$1")
                      [ -n "$diff" ] && ! grep -E '^[-+][^-+]' <<< "$diff" | grep -Evq '^[-+]    "version": "[^"]*",?$'
                  }

                  infra='' pkg='' shared='' web='' websrc='' fmt='' frameworks=''
                  while IFS= read -r file; do
                      case "$file" in
                          # oxfmt formats Markdown and YAML too
                          *.md | docs/* | .agents/* | .claude/* | .changeset/* | .github/workflows/*) fmt=1 ;;
                          website/src/*) web=1 websrc=1 ;;
                          website/*) web=1 ;;
                          # The version PR only bumps "version"; the push that merges it still runs everything, and Release
                          # publishes only after that run passes
                          packages/*/package.json)
                              if [ "$GITHUB_EVENT_NAME" = pull_request ] && version_only "$file"; then
                                  fmt=1
                              else
                                  infra=1
                              fi
                              ;;
                          *)
                              if [[ $file =~ ^packages/semi-[a-z-]+-(react|vue|solid|svelte)/(src|__tests__)/ ]]; then
                                  pkg=1
                                  case " $frameworks " in *" ${BASH_REMATCH[1]} "*) ;; *) frameworks="$frameworks ${BASH_REMATCH[1]}" ;; esac
                              elif [[ $file =~ ^packages/(shared|plugins)/semi-[a-z-]+/(src|__tests__)/ ]]; then
                                  shared=1
                              else
                                  infra=1
                              fi
                              ;;
                      esac
                  done < <(git diff --name-only "$BASE" HEAD)

                  if [ -n "$infra" ]; then
                      full
                      exit 0
                  fi
                  lint='' build='' typecheck='' tests=''
                  # The site reads packages/ for demos and API tables; Deploy preview reads `build` as "the site changed"
                  if [ -n "$pkg$shared$web" ]; then
                      lint=full build=true
                  elif [ -n "$fmt" ]; then
                      lint=fmt
                  fi
                  if [ -n "$pkg$shared" ]; then
                      typecheck=full
                  elif [ -n "$web" ]; then
                      typecheck=website
                  fi
                  # Every framework's tests import the shared packages; the common project holds website/src tests
                  if [ -n "$shared" ]; then
                      tests=$all
                  else
                      tests="$frameworks${websrc:+ common}"
                      tests="${tests# }"
                  fi
                  printf '%s\n' "lint=$lint" "build=$build" "typecheck=$typecheck" "tests=$tests" "changed=$BASE" >> "$GITHUB_OUTPUT"

    # Package exports point at dist, which lint, typecheck and the tests all resolve, so one job builds it for the others
    build:
        needs: gate
        if: needs.gate.outputs.build == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup

    # Runs without dist when only the format check applies, so it cannot wait for build to succeed
    lint:
        needs: [gate, build]
        if: ${{ !cancelled() && needs.gate.outputs.lint != '' && needs.build.result != 'failure' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
              with:
                  dist: ${{ needs.gate.outputs.lint == 'full' && 'required' || 'none' }}
            - run: pnpm format:check
            - if: needs.gate.outputs.lint == 'full'
              run: pnpm lint

    # The tests' configs re-check the component source and take about half the CPU time, so they get their own job;
    # gate's `website` scope only needs `astro check` and the API table check, which the source part runs
    types:
        name: typecheck (${{ matrix.part }})
        needs: [gate, build]
        if: needs.gate.outputs.typecheck != ''
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                part: [source, vitest]
        env:
            PICKED: ${{ needs.gate.outputs.typecheck == 'full' || matrix.part == 'source' }}
        steps:
            - if: env.PICKED == 'true'
              uses: actions/checkout@v5
            - if: env.PICKED == 'true'
              uses: ./.github/actions/setup
              with:
                  dist: required
            - if: needs.gate.outputs.typecheck == 'full'
              run: pnpm exec node scripts/typecheck.ts ${{ matrix.part }}
            - if: matrix.part == 'source'
              run: pnpm --filter semi-website check
            # The API tables print the packages' types, so they go stale when a component's props change
            - if: matrix.part == 'source'
              run: pnpm --filter semi-website gen:api:check

    # main's ruleset requires a check named `typecheck`; a job that only `needs` types would skip on a red part, and a
    # skipped job passes the ruleset
    typecheck:
        needs: [gate, types]
        if: ${{ !cancelled() && needs.gate.outputs.typecheck != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - env:
                  RESULT: ${{ needs.types.result }}
              run: |
                  echo "types: $RESULT"
                  [ "$RESULT" = success ]

    # A job-level `if` cannot read `matrix`, so a leg that gate did not pick skips its steps instead. Three shards keep
    # one run at 18 concurrent jobs with lint and both types parts, under the account's limit of 20
    shard:
        name: test (${{ matrix.project }}) ${{ matrix.shard }}/3
        needs: [gate, build]
        if: needs.gate.outputs.tests != ''
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                project: [react, vue, solid, svelte, common]
                shard: [1, 2, 3]
        env:
            PICKED: ${{ contains(needs.gate.outputs.tests, matrix.project) }}
            CHANGED: ${{ needs.gate.outputs.changed }}
        steps:
            - if: env.PICKED == 'true'
              uses: actions/checkout@v5
            # `--changed` diffs against the base, which the shallow checkout does not have
            - if: env.PICKED == 'true' && env.CHANGED != ''
              run: git fetch --depth=1 origin "$CHANGED"
            - if: env.PICKED == 'true'
              uses: ./.github/actions/setup
              with:
                  dist: required
            - if: env.PICKED == 'true'
              run: pnpm exec vp test run --silent --shard ${{ matrix.shard }}/3 --project '${{ matrix.project }}' --project '${{ matrix.project }}-ssr' ${CHANGED:+--changed "$CHANGED" --passWithNoTests}

    # main's ruleset requires one check per project, `test (<project>)`; `needs.shard.result` only covers all shards at once
    test:
        needs: [gate, shard]
        if: ${{ !cancelled() && needs.gate.outputs.tests != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: read
        strategy:
            fail-fast: false
            matrix:
                project: [react, vue, solid, svelte, common]
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  PROJECT: ${{ matrix.project }}
              run: |
                  conclusions=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | startswith("test (" + env.PROJECT + ") ")) | .conclusion')
                  echo "$conclusions"
                  [ -n "$conclusions" ] && ! grep -vqx success <<< "$conclusions"
