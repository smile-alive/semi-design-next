name: CI

on:
    # Markdown feeds no build or test (the site reads .mdx), and the pre-commit hook formats it
    pull_request:
        paths-ignore: ['**/*.md']
    # Every push to release runs, since a changeset is a .md file; main runs this through release.yml
    push:
        branches: [release]
    workflow_call:

# Push runs queue instead of cancelling, so a deploy or release never stops halfway
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

# Each job builds first: package exports point at dist, which lint, typecheck and the tests all resolve
jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: jdx/mise-action@v5
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm build
            - run: pnpm lint

    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: jdx/mise-action@v5
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm typecheck

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6]
        steps:
            - uses: actions/checkout@v5
            - uses: jdx/mise-action@v5
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            # `pnpm check` also runs the browser projects; those run in browser.yml, so this job runs the jsdom and node ones
            - run: pnpm test --shard=${{ matrix.shard }}/6

    preview:
        if: github.repository == 'smile-alive/semi-design-next' && github.event_name == 'push' && github.ref == 'refs/heads/release'
        needs: [lint, typecheck, test]
        uses: ./.github/workflows/site.yml
        secrets: inherit
