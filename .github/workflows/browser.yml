name: Browser tests

# The full Chromium, Firefox and WebKit matrix takes over half an hour, so it runs daily instead of on every PR.
on:
    schedule:
        - cron: '0 18 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    browser:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                project: [react, vue, solid, svelte, common]
        steps:
            - uses: actions/checkout@v5
            - uses: jdx/mise-action@v3
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium firefox webkit
            - run: pnpm build
            - run: pnpm exec vp test run --project '${{ matrix.project }}*-browser'
            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: screenshots-${{ matrix.project }}
                  path: tmp/vitest
                  if-no-files-found: ignore
