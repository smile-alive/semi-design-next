name: Browser tests

# The full Chromium, Firefox and WebKit matrix takes over half an hour, so it runs daily instead of on every PR.
on:
    schedule:
        - cron: '0 18 * * *'
    workflow_dispatch:

permissions:
    contents: read
    # `gh run list` reads this workflow's past runs
    actions: read

jobs:
    # Compared against the last passing run, not a time window: a late schedule then neither skips nor repeats a commit
    changes:
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            count: ${{ steps.commits.outputs.count }}
        steps:
            - id: commits
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  passed=$(gh run list --workflow "$GITHUB_WORKFLOW" --branch "$GITHUB_REF_NAME" --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
                  if [ -z "$passed" ]; then
                      count=all
                  else
                      count=$(gh api "repos/$GITHUB_REPOSITORY/compare/$passed...$GITHUB_SHA" --jq '[.files[].filename | select(test("\\.md$|^(docs|website|\\.agents|\\.claude|\\.changeset|\\.github/workflows)/") | not)] | length')
                  fi
                  echo "count=$count" >> "$GITHUB_OUTPUT"

    browser:
        needs: changes
        # !cancelled(): a manual run skips `changes`, which would otherwise skip this job too; a failed check still runs it
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.count != '0') }}
        runs-on: ubuntu-latest
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                project: [react, vue, solid, svelte, common]
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - id: playwright
              run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
            - id: browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
            - if: steps.browsers.outputs.cache-hit != 'true'
              run: pnpm exec playwright install --with-deps chromium firefox webkit
            # the cache holds the browsers only; the system libraries they load still come from apt
            - if: steps.browsers.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium firefox webkit
            - run: pnpm exec vp test run --project '${{ matrix.project }}*-browser'
            - if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: screenshots-${{ matrix.project }}
                  path: tmp/vitest
                  if-no-files-found: ignore
