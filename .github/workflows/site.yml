name: Deploy site

# workflow_run only fires from this file on the default branch
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: site
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deploy:
        # When main has moved past the commit CI passed, that commit's own CI run deploys it
        if: >-
            github.repository == 'smile-alive/semi-design-next' && (github.event_name == 'workflow_dispatch'
                || (github.event.workflow_run.conclusion == 'success'
                    && github.event.workflow_run.event == 'push'
                    && github.event.workflow_run.head_sha == github.sha))
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v5
            - uses: jdx/mise-action@v5
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm site:build
            # wrangler-action installs wrangler with `pnpm add` at the workspace root, which pnpm refuses
            - run: pnpm dlx wrangler@4.153.0 pages deploy website/dist --project-name=semi-design-next --branch=main
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
