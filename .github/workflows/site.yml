name: Deploy site

# Called after CI passes on a push: main deploys the production site, release a preview at release.<project>.pages.dev.
# A manual run deploys the branch picked in "Use workflow from"
on:
    workflow_call:
    workflow_dispatch:

concurrency:
    group: site-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deploy:
        if: github.repository == 'smile-alive/semi-design-next' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v5
            - uses: jdx/mise-action@v5
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm site:build
            # wrangler-action installs wrangler with `pnpm add` at the workspace root, which pnpm refuses
            - run: pnpm dlx wrangler@4.153.0 pages deploy website/dist --project-name=semi-design-next --branch=${{ github.ref_name }}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
