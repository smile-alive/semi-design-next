name: Release

# Runs after CI passes on a push to release: with changesets pending it keeps the version PR current, otherwise it
# publishes what the version commit bumped and moves main to the published commit. npm Trusted Publishing matches this
# file as the top-level workflow, so publishing stays here rather than in a reusable workflow
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [release]

permissions:
    contents: read

jobs:
    release:
        if: github.repository == 'smile-alive/semi-design-next' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        concurrency: release
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        outputs:
            published: ${{ steps.changesets.outputs.published }}
        steps:
            # Full history: the final push to main is a fast-forward only if git can see main's tip among HEAD's ancestors,
            # and a shallow clone rejects it with "fetch first"
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            # Under workflow_run github.sha is the branch tip, which the checkout follows; a newer push gets its own run,
            # so this one must not build code that CI did not pass. Nothing to version or publish skips the build
            - id: pending
              env:
                  TESTED: ${{ github.event.workflow_run.head_sha }}
                  MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
              run: |
                  if [ "$TESTED" != "$GITHUB_SHA" ]; then
                      exit 0
                  fi
                  if [ -n "$(find .changeset -name '*.md' ! -name README.md)" ] || [ "${MESSAGE#chore: 发布新版本}" != "$MESSAGE" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  fi
            - if: steps.pending.outputs.run == 'true'
              uses: ./.github/actions/setup
              with:
                  dist: none
            # Published files are always built from this commit, never restored from a cache
            - if: steps.pending.outputs.run == 'true'
              run: pnpm build
            # v1 finds published packages by parsing "New tag:" lines that Changesets CLI v3 no longer prints, so it
            # skipped tags and GitHub releases; v2 reads the CLI's CHANGESETS_OUTPUT file. v2 has no floating major tag.
            # No NPM_TOKEN: every @fibrae package trusts this workflow, so the CLI publishes through OIDC
            # (`id-token: write`) and attaches provenance on its own
            - id: changesets
              if: steps.pending.outputs.run == 'true'
              uses: changesets/action@v2.1.2
              with:
                  # Changesets indents CHANGELOG lists by 2 and vp fmt by 4, so an unformatted version commit fails CI
                  version-script: pnpm changeset:version
                  publish-script: pnpm changeset publish
                  pr-title: 'chore: 发布新版本'
                  commit-message: 'chore: 发布新版本'
            # main is a fast-forward pointer to the last published commit; the SHA already carries release's check runs
            - if: steps.changesets.outputs.published == 'true'
              run: git push origin HEAD:main

    # A push made with GITHUB_TOKEN triggers no workflow, so the production deploy is called here
    site:
        needs: release
        if: needs.release.outputs.published == 'true'
        uses: ./.github/workflows/site.yml
        with:
            branch: main
        secrets: inherit
