name: Release

# workflow_run only fires from this file on the default branch
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

concurrency: release

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release:
        # changesets/action tags and resets the version branch at github.sha, the newest main commit; when main
        # has moved past the commit CI passed, that commit's own CI run releases it
        if: >-
            github.repository == 'smile-alive/semi-design-next' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: jdx/mise-action@v3
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - uses: changesets/action@v1
              with:
                  version: pnpm changeset version
                  publish: pnpm changeset publish
                  title: 'chore: 发布新版本'
                  commit: 'chore: 发布新版本'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # No NPM_TOKEN: every @fibrae package trusts this workflow, so pnpm publishes through OIDC
                  # (`id-token: write`) and attaches provenance on its own
