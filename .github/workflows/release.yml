name: Release

# workflow_run only fires from this file on the default branch
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

concurrency: release

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release:
        # changesets/action tags and resets the version branch at github.sha, the newest main commit; when main
        # has moved past the commit CI passed, that commit's own CI run releases it
        if: >-
            github.repository == 'smile-alive/semi-design-next' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: jdx/mise-action@v5
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            # v1 finds published packages by parsing "New tag:" lines that Changesets CLI v3 no longer prints, so it
            # skipped tags and GitHub releases; v2 reads the CLI's CHANGESETS_OUTPUT file. v2 has no floating major tag.
            # No NPM_TOKEN: every @fibrae package trusts this workflow, so the CLI publishes through OIDC
            # (`id-token: write`) and attaches provenance on its own
            - uses: changesets/action@v2.1.2
              with:
                  version-script: pnpm changeset version
                  publish-script: pnpm changeset publish
                  pr-title: 'chore: 发布新版本'
                  commit-message: 'chore: 发布新版本'
