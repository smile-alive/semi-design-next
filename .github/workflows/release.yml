name: Release

# A push trigger, not workflow_run: workflow_run sets github.sha and github.ref to the default branch (release), and
# changesets/action resets the version branch, tags and targets its PR from those. npm Trusted Publishing matches
# this file as the top-level workflow, so publishing stays here rather than in a reusable workflow
on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    # ci.yml saves this marker after passing on release; merging release into main usually keeps the same tree
    gate:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            passed: ${{ steps.marker.outputs.cache-hit }}
        steps:
            - id: marker
              uses: actions/cache/restore@v6
              with:
                  path: .ci-passed
                  key: ci-passed-${{ github.event.head_commit.tree_id }}
                  lookup-only: true

    # main's ruleset makes the version PR pass CI before this squash lands. Its PR-scoped cache is out of the gate's reach,
    # so the commit title identifies it
    ci:
        needs: gate
        if: "needs.gate.outputs.passed != 'true' && !startsWith(github.event.head_commit.message, 'chore: 发布新版本')"
        uses: ./.github/workflows/ci.yml

    release:
        # A skipped dependency would skip this job too, so the condition states which results may continue
        if: ${{ !cancelled() && github.repository == 'smile-alive/semi-design-next' && needs.gate.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
        needs: [gate, ci]
        runs-on: ubuntu-latest
        concurrency: release
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
              with:
                  dist: none
            # Published files are always built from this commit, never restored from a cache
            - run: pnpm build
            # v1 finds published packages by parsing "New tag:" lines that Changesets CLI v3 no longer prints, so it
            # skipped tags and GitHub releases; v2 reads the CLI's CHANGESETS_OUTPUT file. v2 has no floating major tag.
            # No NPM_TOKEN: every @fibrae package trusts this workflow, so the CLI publishes through OIDC
            # (`id-token: write`) and attaches provenance on its own
            - id: changesets
              uses: changesets/action@v2.1.2
              with:
                  # Changesets indents CHANGELOG lists by 2 and vp fmt by 4, so an unformatted version commit fails CI
                  version-script: pnpm changeset:version
                  publish-script: pnpm changeset publish
                  pr-title: 'chore: 发布新版本'
                  commit-message: 'chore: 发布新版本'
            # The version commit lands on main only; without this PR the next release -> main PR conflicts on it
            - if: steps.changesets.outputs.published == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/release...main" --jq .ahead_by)" = 0 ]; then
                      exit 0
                  fi
                  if [ -n "$(gh pr list --base release --head main --state open --json number --jq '.[].number')" ]; then
                      exit 0
                  fi
                  gh pr create --base release --head main --title 'chore: 发版后同步 main 到 release' \
                      --body '发布后 main 上的版本提交与 CHANGELOG 合回 release。用「Create a merge commit」合并。'

    site:
        if: ${{ !cancelled() && github.repository == 'smile-alive/semi-design-next' && needs.gate.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
        needs: [gate, ci]
        uses: ./.github/workflows/site.yml
        secrets: inherit
