name: Release

# A push to release with changesets pending opens or updates the version PR right away, since versioning needs no CI
# result. After CI passes on the version commit it publishes what that commit bumped and moves main to it. npm Trusted
# Publishing matches this file as the top-level workflow, so publishing stays here rather than in a reusable workflow
on:
    push:
        branches: [release]
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [release]

permissions:
    contents: read

jobs:
    release:
        if: github.repository == 'smile-alive/semi-design-next' && (github.event_name == 'push' || github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Versioning and publishing never act on the same commit; one shared group would let a queued push run replace a
        # pending publish
        concurrency: release-${{ github.event_name }}
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        outputs:
            published: ${{ steps.changesets.outputs.published }}
        steps:
            # Full history: the final push to main is a fast-forward only if git can see main's tip among HEAD's ancestors,
            # and a shallow clone rejects it with "fetch first"
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            # Under workflow_run github.sha is the branch tip, which the checkout follows; a newer push gets its own run,
            # so this one must not publish code that CI did not pass
            - id: pending
              env:
                  TESTED: ${{ github.event.workflow_run.head_sha }}
                  MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
              run: |
                  pending=$(find .changeset -name '*.md' ! -name README.md)
                  if [ "$GITHUB_EVENT_NAME" = push ]; then
                      if [ -n "$pending" ]; then
                          echo "run=true" >> "$GITHUB_OUTPUT"
                      fi
                      exit 0
                  fi
                  if [ "$TESTED" = "$GITHUB_SHA" ] && [ -z "$pending" ] && [ "${MESSAGE#chore: 发布新版本}" != "$MESSAGE" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  fi
            - if: steps.pending.outputs.run == 'true'
              uses: ./.github/actions/setup
              with:
                  dist: none
            # Published files are always built from this commit, never restored from a cache
            - if: steps.pending.outputs.run == 'true' && github.event_name == 'workflow_run'
              run: pnpm build
            # v1 finds published packages by parsing "New tag:" lines that Changesets CLI v3 no longer prints, so it
            # skipped tags and GitHub releases; v2 reads the CLI's CHANGESETS_OUTPUT file. v2 has no floating major tag.
            # No NPM_TOKEN: every @fibrae package trusts this workflow, so the CLI publishes through OIDC
            # (`id-token: write`) and attaches provenance on its own
            - id: changesets
              if: steps.pending.outputs.run == 'true'
              uses: changesets/action@v2.1.2
              with:
                  # Changesets indents CHANGELOG lists by 2 and vp fmt by 4, so an unformatted version commit fails CI
                  version-script: pnpm changeset:version
                  publish-script: pnpm changeset publish
                  pr-title: 'chore: 发布新版本'
                  commit-message: 'chore: 发布新版本'
            # main is a fast-forward pointer to the last published commit; the SHA already carries release's check runs
            - if: steps.changesets.outputs.published == 'true'
              run: git push origin HEAD:main

    # A push made with GITHUB_TOKEN triggers no workflow, so the production deploy is called here
    site:
        needs: release
        if: needs.release.outputs.published == 'true'
        uses: ./.github/workflows/site.yml
        with:
            branch: main
        secrets: inherit
